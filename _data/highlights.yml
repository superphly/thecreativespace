# Home-page highlights, carried over from the original site's rotator items.
- title: BarCamp 2008
  text: >-
    In 2008, The Creative Space hosted BarCampTX, a user-generated conference
    (or unconference). Over 30 presenters, two kegs and 120+ of the smartest
