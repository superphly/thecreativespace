---
layout: default
---
<article class="page profile">
  <header class="profile-header">
    {% if page.photo %}<img class="project-logo" src="{{ page.photo | relative_url }}" alt="{{ page.title }}">{% endif %}
    <div>
      <h1>{{ page.title }}</h1>
    </div>
  </header>
  {{ content }}
  <p class="backlink"><a href="{{ '/projects/' | relative_url }}">&larr; All projects</a></p>
</article>
